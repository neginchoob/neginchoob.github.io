gzip            on;
gzip_vary       on;
gzip_proxied    any;
gzip_comp_level 6;
gzip_types      text/plain text/css application/json application/javascript text/javascript image/svg+xml;

# The old admin panel no longer exists
location = /admin {
  return 301 /;
}

# Single-page app: every route (e.g. /gallery/export from QR codes) loads index.html
location / {
  index index.html;
  try_files $uri $uri/ /index.html;
}

location = /index.html {
  expires -1;
}

location /assets/ {
  expires 1y;
  add_header Cache-Control "public, immutable";
}

location /textures/ {
  expires 1M;
  add_header Cache-Control "public";
}
